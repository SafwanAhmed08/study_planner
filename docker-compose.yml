services:
  backend:
    build:
      context: ./backend
    image: study-planner-backend
    ports:
      - "8000:8000"
    environment:
      DATA_PATH: /app/data
      HF_HOME: /app/model-cache
      LLM_BASE_URL: http://host.docker.internal:1234/v1/chat/completions
    volumes:
      - backend-data:/app/data
      - model-cache:/app/model-cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: study-planner-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
  model-cache: